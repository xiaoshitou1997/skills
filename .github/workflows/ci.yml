name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Static bundle validation (skills, frontmatter, references, duplicates, syntax)
        run: python tests/validate_bundle.py
      - name: Offline unit tests (stubs only; no Docker/WSL required)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
        env:
          PYTHONUTF8: '1'
