<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家族主色选型</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: oklch(0.97 0.004 250); color: oklch(0.25 0.01 250); }
body.dark { background: oklch(0.15 0.008 250); color: oklch(0.93 0.006 250); }
.wrap { max-width: 1500px; margin: auto; padding: 26px 30px 96px; }
header { position: sticky; top: 0; z-index: 6; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 12px 0; background: oklch(0.97 0.004 250 / .8); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(128,128,128,.25); margin-bottom: 18px; }
body.dark header { background: oklch(0.15 0.008 250 / .8); }
h1 { margin: 0; font-size: 26px; letter-spacing: -.04em; }
.sub { margin: 5px 0 0; font-size: 12.5px; color: inherit; opacity: .65; }
.seg { display: inline-flex; border: 1px solid rgba(128,128,128,.35); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 16px; cursor: pointer; font: inherit; font-size: 12.5px; color: inherit; }
.seg button[aria-pressed="true"] { background: rgba(128,128,128,.18); font-weight: 650; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.card { position: relative; border-radius: 18px; cursor: pointer; text-align: left; border: 1px solid rgba(128,128,128,.28); overflow: hidden; padding: 0; font: inherit; color: inherit; background: var(--surface); transition: transform .24s cubic-bezier(0.32, 0.72, 0, 1); display: block; width: 100%; }
.card:hover { transform: translateY(-2px); }
.card.selected { outline: 2px solid var(--accent); outline-offset: 2px; }
.pick { position: absolute; top: 8px; right: 8px; z-index: 2; width: 22px; height: 22px; border-radius: 50%; display: none; place-items: center; background: var(--accent); color: var(--btn-ink); font-size: 12px; }
.card.selected .pick { display: grid; }
.mini { background: var(--bg); color: var(--text); }
.mini-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.mini-bar b { font-size: 12px; }
.wins { margin-left: auto; display: flex; gap: 5px; }
.wins i { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
.mini-body { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 11px 12px 0; }
.rows .row { padding: 6px 8px; border-radius: 9px; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
.row.sel { background: var(--soft); color: var(--strong); font-weight: 600; }
.row em { font-style: normal; opacity: .75; }
.btn { display: block; width: 100%; text-align: center; background: var(--btn); color: var(--btn-ink); border-radius: 11px; padding: 7px 0; font-size: 11.5px; font-weight: 600; }
.link { margin-top: 9px; color: var(--strong); font-size: 11.5px; font-weight: 600; }
.inp { margin-top: 8px; border: 1px solid var(--border); border-radius: 9px; padding: 5px 8px; font-size: 11px; color: var(--muted); background: var(--surface); }
.tags { margin-top: 9px; display: flex; gap: 5px; flex-wrap: wrap; }
.t { font-size: 10px; padding: 2px 7px; border-radius: 999px; }
.t.s { color: var(--success); border: 1px solid color-mix(in oklab, var(--success) 45%, transparent); }
.t.w { color: var(--warning); border: 1px solid color-mix(in oklab, var(--warning) 45%, transparent); }
.t.d { color: var(--danger); border: 1px solid color-mix(in oklab, var(--danger) 45%, transparent); }
.t.i { color: var(--muted); border: 1px dashed rgba(128,128,128,.5); }
.ramp { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; padding: 11px 12px 0; }
.ramp i { height: 16px; border-radius: 3px; }
.checks { padding: 8px 12px 0; font-size: 10.5px; color: var(--muted); }
.meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 9px 12px; background: var(--surface); color: var(--muted); font-size: 11px; border-top: 1px solid var(--border); }
.meta b { color: var(--text); font-size: 12.5px; }
.ctrl { padding: 10px 12px; display: grid; gap: 8px; background: var(--surface); border-top: 1px solid var(--border); }
.ctrl label { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.seg2 { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
.seg2 button { border: 0; background: transparent; padding: 4px 10px; font: inherit; font-size: 11px; color: var(--muted); cursor: pointer; }
.seg2 button[aria-pressed="true"] { background: var(--soft); color: var(--strong); font-weight: 600; }
.picked { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; max-width: min(92vw, 720px); background: oklch(0.22 0.01 250); color: oklch(0.95 0.005 250); border-radius: 999px; padding: 10px 22px; font-size: 12.5px; box-shadow: 0 8px 30px rgba(0,0,0,.28); z-index: 5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.picked b { color: oklch(0.85 0.06 250); }
@media (max-width: 720px) { .wrap { padding: 18px 12px 96px; } .grid { grid-template-columns: 1fr; } .mini-body { grid-template-columns: 84px 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>家族主色选型</h1>
      <p class="sub">每张卡片 = 一组种子（hue × 档位）整套推导的实时试穿。批次切换换一组候选；点卡片选中，底部确认；也可拖滑杆自定义。</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
      <div class="seg" id="batchSeg" role="group" aria-label="候选批次"></div>
      <div class="seg" role="group" aria-label="明暗切换">
        <button type="button" data-theme="light" aria-pressed="true">☀ 明</button>
        <button type="button" data-theme="dark" aria-pressed="false">☾ 暗</button>
      </div>
    </div>
  </header>
  <main class="grid" id="grid"></main>
</div>
<div class="picked" id="picked">未选择 —— 点击卡片比选，或拖「自定义」滑杆</div>
<script>
const BATCHES = [
  { name: '一批 · 标准/灰调', items: [
    { label: '蓝 250', hue: 250, c: .16,  mode: '标准', profile: 'std' },
    { label: '青绿 170', hue: 170, c: .16, mode: '标准', profile: 'std' },
    { label: '暖橙 55', hue: 55, c: .16,  mode: '标准', profile: 'std' },
    { label: '紫 290', hue: 290, c: .15, mode: '标准', profile: 'std' },
    { label: '雾蓝 230', hue: 230, c: .08,  mode: '灰调', profile: 'gray' },
    { label: '墨绿 175', hue: 175, c: .075, mode: '灰调', profile: 'gray' },
    { label: '酒红 12', hue: 12, c: .09,  mode: '灰调', profile: 'gray' },
    { label: '焦糖 65', hue: 65, c: .085, mode: '灰调', profile: 'gray' }
  ] },
  { name: '二批 · 深调/新色', items: [
    { label: '藏青 268', hue: 268, c: .10, mode: '深调', profile: 'deep' },
    { label: '松绿 160', hue: 160, c: .09, mode: '深调', profile: 'deep' },
    { label: '茄紫 305', hue: 305, c: .10, mode: '深调', profile: 'deep' },
    { label: '玳瑁 42', hue: 42, c: .10, mode: '深调', profile: 'deep' },
    { label: '天青 205', hue: 205, c: .15, mode: '标准', profile: 'std' },
    { label: '青瓷 190', hue: 190, c: .08, mode: '灰调', profile: 'gray' },
    { label: '梅子 330', hue: 330, c: .085, mode: '灰调', profile: 'gray' },
    { label: '苔绿 115', hue: 115, c: .075, mode: '灰调', profile: 'gray' }
  ] }
];
let activeBatch = 1;
const RAMP = [[50,.96,.025],[100,.92,.05],[200,.87,.07],[300,.80,.09],[400,.72,.115],[500,.65,.13],[600,.58,.13],[700,.50,.125],[800,.44,.12],[900,.36,.1]];
const oklch = (l, c, h) => `oklch(${l} ${c} ${h})`;
const r4 = v => Math.round(v * 10000) / 10000;
function linearFromOklch(l, c, h) {
  const rad = h * Math.PI / 180, a = c * Math.cos(rad), b = c * Math.sin(rad);
  const lms = [
    (l + 0.3963377774 * a + 0.2158037573 * b) ** 3,
    (l - 0.1055613458 * a - 0.0638541728 * b) ** 3,
    (l - 0.0894841775 * a - 1.2914855480 * b) ** 3
  ];
  return [
    4.0767416621 * lms[0] - 3.3077115913 * lms[1] + 0.2309699292 * lms[2],
    -1.2684380046 * lms[0] + 2.6097574011 * lms[1] - 0.3413193965 * lms[2],
    -0.0041960863 * lms[0] - 0.7034186147 * lms[1] + 1.7076147010 * lms[2]
  ].map(v => Math.min(1, Math.max(0, v)));
}
const luminance = rgb => 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
function pairRatio(fg, bg, hue) {
  const f = fg === 'white' ? [1, 1, 1] : linearFromOklch(fg[0], fg[1], fg.length > 2 ? fg[2] : hue);
  const b = bg === 'white' ? [1, 1, 1] : linearFromOklch(bg[0], bg[1], bg.length > 2 ? bg[2] : hue);
  const hi = Math.max(luminance(f), luminance(b)), lo = Math.min(luminance(f), luminance(b));
  return (hi + 0.05) / (lo + 0.05);
}
function palette(hue, c, theme, profile) {
  const light = theme === 'light';
  const deep = profile === 'deep';
  const p = light ? {
    bg: [.985, .004], surface: [1, 0], border: [.9, .006], text: [.25, .01], muted: [.42, .015],
    accent: [deep ? .46 : .60, c], strong: [deep ? .34 : .44, r4(c * (deep ? .95 : .75))], soft: [deep ? .94 : .95, r4(c * (deep ? .22 : .15))],
    success: [.55, .12, 145], warning: [.65, .13, 85], danger: [.55, .16, 27],
    btnInk: 'white'
  } : {
    bg: [.17, .008], surface: [.22, .01], border: [.32, .012], text: [.93, .006], muted: [.72, .012],
    accent: [deep ? .80 : .76, r4(c * (deep ? .8 : .78))], strong: [deep ? .87 : .85, r4(c * (deep ? .65 : .47))], soft: [deep ? .30 : .28, r4(c * (deep ? .4 : .375))],
    success: [.72, .12, 145], warning: [.78, .12, 85], danger: [.68, .15, 27],
    btnInk: [.17, .01]
  };
  if (light && !deep) {
    let deepL = .60;
    while (deepL > .3 && pairRatio('white', [deepL, c], hue) < 3) deepL = r4(deepL - .04);
    p.btn = [deepL, c]; p.deepL = deepL;
  } else {
    p.btn = p.accent; p.deepL = p.accent[0];
  }
  return p;
}
function applyCard(card, hue, c, theme, profile) {
  const p = palette(hue, c, theme, profile);
  const set = (n, t) => card.style.setProperty(n, oklch(t[0], t[1], t.length > 2 ? t[2] : hue));
  for (const [n, t] of [['--bg', p.bg], ['--surface', p.surface], ['--border', p.border], ['--text', p.text], ['--muted', p.muted], ['--accent', p.accent], ['--strong', p.strong], ['--soft', p.soft], ['--success', p.success], ['--warning', p.warning], ['--danger', p.danger]]) set(n, t);
  card.style.setProperty('--btn', oklch(p.btn[0], p.btn[1], p.btn.length > 2 ? p.btn[2] : hue));
  card.style.setProperty('--btn-ink', p.btnInk === 'white' ? '#fff' : oklch(p.btnInk[0], p.btnInk[1], hue));
  card.querySelector('.ramp').innerHTML = RAMP.map(([, L, C]) => {
    const cs = C;
    const ink = L > .6 ? oklch(.25, .01, hue) : oklch(.95, .01, hue);
    return `<i style="background:${oklch(L, cs, hue)};box-shadow:inset 0 0 0 1px ${ink}22"></i>`;
  }).join('');
  const pairs = theme === 'light'
    ? [[p.text, p.bg, 4.5], [p.muted, p.bg, 4.5], ['white', p.btn, 3], [p.accent, p.bg, 3]]
    : [[p.text, p.bg, 4.5], [p.muted, p.bg, 4.5], [p.accent, p.bg, 4.5], [p.btnInk, p.btn, 4.5]];
  const pass = pairs.filter(([f, b, m]) => pairRatio(f, b, hue) >= m).length;
  card.querySelector('.checks').textContent = `对比度 ${pass}/${pairs.length} ✓　·　${theme === 'light' ? (profile === 'deep' ? `按钮底＝主档 L${p.deepL}（白字天然过）` : `按钮底 L${p.deepL}（白字回炉）`) : '按钮底提亮、深字'}`;
  const infoNote = Math.abs(hue - 250) <= 15 ? '<span class="t i">info 与主色同域，以彩度差区分</span>' : '';
  card.querySelector('.tags').innerHTML = '<span class="t s">成功</span><span class="t w">警告</span><span class="t d">失败</span>' + infoNote;
}
const MINI = `
  <span class="pick">✓</span>
  <div class="mini">
    <div class="mini-bar"><i class="dot"></i><b>OmniMail</b><span class="wins"><i></i><i></i><i></i></span></div>
    <div class="mini-body">
      <div class="rows"><div class="row sel">收件箱 <em>4</em></div><div class="row">已加星标</div><div class="row">草稿 <em>2</em></div></div>
      <div>
        <span class="btn">＋ 写邮件</span>
        <div class="link">查看本周报表 →</div>
        <div class="inp">⌕　搜索邮件…</div>
        <div class="tags"></div>
      </div>
    </div>
    <div class="ramp"></div>
    <div class="checks"></div>
  </div>`;
const grid = document.querySelector('#grid');
let theme = 'light';
let selected = null;
const pickedBar = document.querySelector('#picked');
const custom = { hue: 200, c: .16, mode: '标准', profile: 'std' };
function cardShell() {
  const el = document.createElement('div');
  el.className = 'card'; el.setAttribute('role', 'radio'); el.setAttribute('aria-checked', 'false'); el.tabIndex = 0;
  el.innerHTML = MINI;
  return el;
}
BATCHES.forEach((batch, bi) => {
  for (const cand of batch.items) {
    const el = cardShell();
    el.dataset.hue = cand.hue; el.dataset.c = cand.c; el.dataset.batch = bi;
    el.insertAdjacentHTML('beforeend', `<div class="meta"><b>${cand.label}</b><span>hue ${cand.hue} · ${cand.mode} · C ${cand.c}</span></div>`);
    el.addEventListener('click', () => select(el, cand));
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(el, cand); } });
    grid.appendChild(el);
    cand.el = el;
  }
});
const customEl = cardShell();
customEl.insertAdjacentHTML('beforeend', `
  <div class="ctrl">
    <label>hue <output>200</output></label>
    <input type="range" min="0" max="359" value="200" aria-label="自定义 hue">
    <div class="seg2" role="group" aria-label="种子档位">
      <button type="button" data-p="std" data-c="0.16" aria-pressed="true">标准</button>
      <button type="button" data-p="gray" data-c="0.08" aria-pressed="false">灰调</button>
      <button type="button" data-p="deep" data-c="0.10" aria-pressed="false">深调</button>
    </div>
  </div>
  <div class="meta"><b>自定义</b><span>拖动实时重推整套色板</span></div>`);
customEl.addEventListener('click', () => select(customEl, { label: '自定义', hue: custom.hue, c: custom.c, mode: custom.mode }));
customEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(customEl, { label: '自定义', hue: custom.hue, c: custom.c, mode: custom.mode }); } });
grid.appendChild(customEl);
const range = customEl.querySelector('input[type="range"]');
const out = customEl.querySelector('output');
range.addEventListener('input', () => {
  custom.hue = Number(range.value);
  out.textContent = range.value;
  applyCard(customEl, custom.hue, custom.c, theme, custom.profile);
  if (selected === customEl) showPicked({ label: '自定义', hue: custom.hue, c: custom.c, mode: custom.mode });
});
for (const b of customEl.querySelectorAll('.seg2 button')) {
  b.addEventListener('click', e => {
    e.stopPropagation();
    for (const x of customEl.querySelectorAll('.seg2 button')) x.setAttribute('aria-pressed', String(x === b));
    custom.profile = b.dataset.p; custom.c = Number(b.dataset.c); custom.mode = b.textContent.trim();
    applyCard(customEl, custom.hue, custom.c, theme, custom.profile);
    if (selected === customEl) showPicked({ label: '自定义', hue: custom.hue, c: custom.c, mode: custom.mode });
  });
}
function showPicked(cand) {
  pickedBar.innerHTML = `已选：<b>${cand.label}</b>（hue ${cand.hue} · ${cand.mode} · C ${cand.c}）—— 回复此名称即可定档`;
}
function select(el, cand) {
  selected = el;
  for (const card of grid.querySelectorAll('.card')) card.setAttribute('aria-checked', String(card === el));
  showPicked(cand);
}
function renderAll() {
  for (const batch of BATCHES) for (const cand of batch.items) applyCard(cand.el, cand.hue, cand.c, theme, cand.profile);
  applyCard(customEl, custom.hue, custom.c, theme, custom.profile);
}
const batchSeg = document.querySelector('#batchSeg');
batchSeg.innerHTML = BATCHES.map((b, i) => `<button type="button" data-batch="${i}" aria-pressed="${i === activeBatch}">${b.name}</button>`).join('');
function showBatch(idx) {
  activeBatch = idx;
  for (const x of batchSeg.querySelectorAll('button')) x.setAttribute('aria-pressed', String(Number(x.dataset.batch) === idx));
  BATCHES.forEach((batch, bi) => batch.items.forEach(cand => { cand.el.style.display = bi === idx ? '' : 'none'; }));
  if (selected && selected !== customEl && Number(selected.dataset.batch) !== idx) {
    selected = null;
    for (const card of grid.querySelectorAll('.card')) card.setAttribute('aria-checked', 'false');
    pickedBar.innerHTML = '未选择 —— 点击卡片比选，或拖「自定义」滑杆';
  }
}
for (const b of batchSeg.querySelectorAll('button')) b.addEventListener('click', () => showBatch(Number(b.dataset.batch)));
for (const b of document.querySelectorAll('.seg[aria-label="明暗切换"] > button')) {
  b.addEventListener('click', () => {
    for (const x of document.querySelectorAll('.seg > button')) x.setAttribute('aria-pressed', String(x === b));
    theme = b.dataset.theme;
    document.body.classList.toggle('dark', theme === 'dark');
    renderAll();
  });
}
renderAll();
showBatch(activeBatch);
</script>
</body>
</html>
